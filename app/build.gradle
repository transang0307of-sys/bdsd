plugins {
    id 'com.android.application'
}

android {
    // Nâng lên 35 theo khuyến nghị của GitHub Actions 2026
    compileSdk 35
    
    useLibrary 'org.apache.http.legacy'
    
    defaultConfig {
        applicationId "com.mbbank.alexherry"
        namespace "com.mbbank.alexherry"
        minSdkVersion 21
        targetSdkVersion 35 // Nâng cho đồng bộ với compileSdk
        versionCode 1
        versionName "1.3"
    }
    
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
}
